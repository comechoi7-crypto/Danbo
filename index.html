<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>출가교화단보</title>
<style>
body{margin:0;background:#f4ede8;color:#3a3330;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{background:#2b2522;color:#f3ebe5;padding:28px 20px;text-align:center}
header h1{margin:0;font-size:24px;letter-spacing:.06em}
header p{margin:6px 0 0;font-size:13px;opacity:.75}
main{max-width:960px;margin:0 auto;padding:28px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px}
a.issue{text-decoration:none;color:inherit;background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 2px 8px #0002;transition:transform .2s,box-shadow .2s}
a.issue:hover{transform:translateY(-4px);box-shadow:0 8px 18px #0003}
a.issue img{width:100%;display:block;aspect-ratio:1241/1754;object-fit:cover}
a.issue div{padding:10px 12px;font-size:14px}
a.issue b{color:#b8876b}
footer{text-align:center;font-size:12px;color:#8a7d75;padding:20px}
</style>
</head>

</main>
